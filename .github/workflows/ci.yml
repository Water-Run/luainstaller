name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-version-matrix:
    name: official Lua ${{ matrix.lua }} (Windows MSVC)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.4.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the pinned Lua version with MSVC
        shell: powershell
        timeout-minutes: 180
        env:
          LUA_VERSION: ${{ matrix.lua }}
        run: |
          $evidenceDir = Join-Path $env:TEMP 'luainstaller-lua-evidence'
          "WINDOWS_EVIDENCE_DIR=$evidenceDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File .\tools\test-lua-versions.ps1 `
            -HostLabel ci-windows-2022-x86_64 `
            -EvidenceDir $evidenceDir `
            -VersionFilter $env:LUA_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-lua-${{ matrix.lua }}-evidence
          path: ${{ env.WINDOWS_EVIDENCE_DIR }}/*.log
          if-no-files-found: warn
          retention-days: 14
