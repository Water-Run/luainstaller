# Required continuous-integration and release gate.
#
# The pinned Lua matrix runs natively on Linux and Windows/MSVC. Additional
# lab hosts broaden coverage but are not prerequisites for a release.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-suites:
    name: local suites (pinned shared Lua 5.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl liblua5.4-dev lua5.4 \
            luarocks unzip zlib1g-dev

      - name: Build pinned shared Lua 5.4.8
        run: |
          sh tools/ci-build-lua54.sh
          "$HOME/luai-lua/bin/lua" -v

      - name: Export pinned Lua environment
        run: |
          echo "$HOME/luai-lua/bin" >> "$GITHUB_PATH"
          {
            echo "LUAI_TEST_LUA=$HOME/luai-lua/bin/lua"
            echo "LUAI_TEST_LUAC=$HOME/luai-lua/bin/luac"
            echo "LUAI_LUA_PREFIX=$HOME/luai-lua"
            echo "LUAI_LUA_RELEASE=5.4.8"
            echo "LUAI_LUA_SOURCE_SHA256=4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae"
            echo "PKG_CONFIG_PATH=$HOME/luai-lua/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=$HOME/luai-lua/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Syntax and shell checks
        run: |
          find src -type f -name '*.lua' -print0 \
            | xargs -0 -n1 "$HOME/luai-lua/bin/luac" -p
          for script in tools/*.sh; do
            if head -1 "$script" | grep -q bash; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done
          git diff --check

      - name: Fast contract suites
        run: |
          lua -v
          lua test/lua_abi.lua
          lua test/version_contract.lua
          lua test/cli_split_smoke.lua
          lua test/contract_docs.lua

      - name: Edge and safety suites
        run: |
          lua test/production_edges.lua
          lua test/onefile_lifecycle.lua
          lua test/distribution_licenses.lua
          lua test/reproducible_artifacts.lua
          lua test/build_interruption.lua

      - name: Install pinned sample dependencies
        run: sh tools/ci-install-sample-deps.sh

      - name: Wire luarocks to the pinned Lua
        run: |
          mkdir -p "$HOME/bin"
          printf '%s\n' '#!/bin/sh' \
            'exec /usr/bin/luarocks --lua-dir="$HOME/luai-lua" "$@"' \
            > "$HOME/bin/luarocks"
          chmod +x "$HOME/bin/luarocks"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Comprehensive smoke audit
        run: lua test/smoke_all.lua

  version-matrix:
    name: official Lua ${{ matrix.lua }} (POSIX runner)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.1.5"
          - "5.2.4"
          - "5.3.6"
          - "5.4.8"
          - "5.5.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install matrix prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libreadline-dev \
            unzip curl ca-certificates clang luajit gcc-mingw-w64-x86-64

      - name: Run the pinned Lua version
        run: |
          VERSION_FILTER='${{ matrix.lua }}' \
            LUAI_MATRIX_EDGE_COVERAGE_MODE=available HOST_LABEL=ci \
            sh tools/test-lua-versions.sh
        timeout-minutes: 120

  windows-version-matrix:
    name: official Lua ${{ matrix.lua }} (Windows MSVC)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        lua:
          - "5.1.5"
          - "5.2.4"
          - "5.3.6"
          - "5.4.8"
          - "5.5.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the pinned Lua version with MSVC
        shell: powershell
        timeout-minutes: 120
        env:
          LUA_VERSION: ${{ matrix.lua }}
        run: |
          $evidenceDir = Join-Path $env:TEMP 'luainstaller-lua-evidence'
          "WINDOWS_EVIDENCE_DIR=$evidenceDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & powershell.exe -NoLogo -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File .\tools\test-lua-versions.ps1 `
            -HostLabel ci-windows-2022-x86_64 `
            -EvidenceDir $evidenceDir `
            -VersionFilter $env:LUA_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-lua-${{ matrix.lua }}-evidence
          path: ${{ env.WINDOWS_EVIDENCE_DIR }}/*.log
          if-no-files-found: warn
          retention-days: 14
