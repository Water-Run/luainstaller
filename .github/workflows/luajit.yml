name: luajit

on:
  push:
    branches: [main, 'codex/luainstaller-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: LuaJIT 2.1 Linux x86_64 (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, lua52compat, nogc64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bubblewrap ca-certificates curl pkg-config
      - name: Build pinned LuaJIT and exercise artifacts
        env:
          LUAI_JIT_CONFIGURATION: ${{ matrix.configuration }}
          LUAI_EXPECT_HOST_ARCH: x86_64
        run: sh tools/test-luajit.sh
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: luajit-linux-${{ matrix.configuration }}-evidence
          path: /tmp/luainstaller-luajit-evidence/*.log
          if-no-files-found: error
          retention-days: 14

  windows:
    name: LuaJIT 2.1 Windows MSVC x86_64 (${{ matrix.configuration }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [default, lua52compat]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned LuaJIT and exercise artifacts
        env:
          LUAI_EXPECT_HOST_ARCH: x86_64
        shell: powershell
        run: |
          $evidence = Join-Path $env:TEMP 'luainstaller-luajit-evidence'
          "LUAJIT_EVIDENCE_DIR=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File .\tools\test-luajit.ps1 -Configuration '${{ matrix.configuration }}' -EvidenceDir $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: luajit-windows-${{ matrix.configuration }}-evidence
          path: ${{ env.LUAJIT_EVIDENCE_DIR }}/*.log
          if-no-files-found: error
          retention-days: 14
